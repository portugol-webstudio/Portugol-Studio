name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup Java 📦
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: temurin
          cache: gradle

      - name: Build 🚚
        run: ./gradlew :portugol-console:build :portugol-analisador:build

      - name: Generate Release Date 📅
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Compress Artifacts 🗜️
        run: |
          # O console e o analisador dependem só do portugol-core, então o `lib/` dos
          # dois é o mesmo e vai uma vez só no tar. Isso é uma invariante implícita: se
          # um deles ganhar uma dependência que o outro não tem, mesclar escolheria uma
          # das versões em silêncio — melhor falhar aqui.
          diff -r console/build/libs/lib analisador/build/libs/lib

          mkdir -p build/dist
          cp -R console/build/libs/. build/dist/
          cp analisador/build/libs/*.jar build/dist/
          tar -cf build/portugol.tar -C build/dist .

      - name: Create Release 🚀
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }}
          files: |
            build/portugol.tar
            build/dist/*.jar
